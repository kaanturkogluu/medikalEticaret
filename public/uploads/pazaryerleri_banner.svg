<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091522" />
      <stop offset="45%" stop-color="#063229" />
      <stop offset="80%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="cardGradHover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4" />
    </filter>

    <!-- Clip Paths -->
    <clipPath id="roundedCorners">
      <rect x="0" y="0" width="1920" height="640" rx="32" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <!-- Base Background -->
    <rect width="1920" height="640" fill="url(#bgGrad)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="160" cy="120" r="280" fill="#059669" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="1700" cy="480" r="320" fill="#10b981" opacity="0.2" filter="url(#softGlow)" />
    <circle cx="1100" cy="180" r="260" fill="#0284c7" opacity="0.15" filter="url(#softGlow)" />

    <!-- Subtle Tech/Medical Grid Lines Pattern -->
    <g opacity="0.06" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="160" x2="1920" y2="160" />
      <line x1="0" y1="320" x2="1920" y2="320" />
      <line x1="0" y1="480" x2="1920" y2="480" />
      <line x1="320" y1="0" x2="320" y2="640" />
      <line x1="640" y1="0" x2="640" y2="640" />
      <line x1="960" y1="0" x2="960" y2="640" />
      <line x1="1280" y1="0" x2="1280" y2="640" />
      <line x1="1600" y1="0" x2="1600" y2="640" />
    </g>

    <!-- Floating Medical Geometric Accents -->
    <g opacity="0.15" fill="#ffffff">
      <!-- Plus 1 -->
      <rect x="860" y="90" width="28" height="8" rx="4" />
      <rect x="870" y="80" width="8" height="28" rx="4" />
      <!-- Plus 2 -->
      <rect x="1820" y="140" width="24" height="6" rx="3" />
      <rect x="1829" y="131" width="6" height="24" rx="3" />
      <!-- Plus 3 -->
      <rect x="120" y="520" width="20" height="6" rx="3" />
      <rect x="127" y="513" width="6" height="20" rx="3" />
    </g>

    <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
    <g transform="translate(100, 0)">

      <!-- Top Pill: Official Seller Badge -->
      <g transform="translate(0, 85)">
        <rect width="470" height="38" rx="19" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
        <!-- Shield Icon -->
        <path d="M22 14 L30 10 L38 14 C38 21 30 26 30 26 C30 26 22 21 22 14 Z" fill="#34d399" />
        <path d="M27 18 L29 20 L33 16" stroke="#064e3b" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <text x="50" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" letter-spacing="1.5">
          T.C. SAĞLIK BAKANLIĞI ÜTS KAYITLI YETKİLİ SATICI
        </text>
      </g>

      <!-- Main Headline -->
      <g transform="translate(0, 160)">
        <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" fill="#ffffff" letter-spacing="-1">
          <tspan x="0" y="44" font-size="44">Tüm Yetkili Pazaryerlerinde</tspan>
          <tspan x="0" y="100" font-size="44" fill="#34d399">umutMed</tspan>
          <tspan y="100" font-size="44" fill="#ffffff"> Güvencesiyle Yanınızdayız!</tspan>
        </text>
      </g>

      <!-- Subtitle Description -->
      <g transform="translate(0, 300)">
        <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" line-height="1.6">
          <tspan x="0" y="0">Orijinal medikal &amp; sağlık ürünlerimizi ister sitemizden en avantajlı fiyatlarla,</tspan>
          <tspan x="0" y="28">isterseniz onaylı pazaryeri mağazalarımızdan %100 güvenle sipariş verebilirsiniz.</tspan>
        </text>
      </g>

      <!-- 3 Trust Badges -->
      <g transform="translate(0, 385)">
        <!-- Badge 1 -->
        <g transform="translate(0, 0)">
          <rect width="240" height="48" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
          <circle cx="28" cy="24" r="14" fill="#10b981" fill-opacity="0.25" />
          <path d="M22 24 L26 28 L34 20" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <text x="52" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">%100 Orijinal Medikal</text>
          <text x="52" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">ÜTS Kayıtlı &amp; Faturalı</text>
        </g>

        <!-- Badge 2 -->
        <g transform="translate(255, 0)">
          <rect width="240" height="48" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
          <circle cx="28" cy="24" r="14" fill="#38bdf8" fill-opacity="0.25" />
          <!-- Fast Shipping Icon -->
          <path d="M20 20 H30 V26 H20 Z M30 22 H34 L37 25 V26 H30 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
          <circle cx="23" cy="28" r="2" fill="#38bdf8" />
          <circle cx="34" cy="28" r="2" fill="#38bdf8" />
          <text x="52" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Aynı Gün Sevk</text>
          <text x="52" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Hızlı &amp; Korunaklı Kargo</text>
        </g>

        <!-- Badge 3 -->
        <g transform="translate(510, 0)">
          <rect width="250" height="48" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
          <circle cx="28" cy="24" r="14" fill="#f59e0b" fill-opacity="0.25" />
          <!-- Star / Guarantee Icon -->
          <polygon points="28,16 31,22 37,23 33,27 34,33 28,30 22,33 23,27 19,23 25,22" fill="#fbbf24" />
          <text x="52" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">Doğrulanmış Satıcı</text>
          <text x="52" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Yüksek Müşteri Memnuniyeti</text>
        </g>
      </g>

      <!-- Bottom Trust Text -->
      <g transform="translate(0, 480)">
        <text font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" letter-spacing="0.5">
          ✦ Tüm pazaryerlerindeki siparişleriniz doğrudan umutMed ana deposundan faturalı olarak sevk edilir.
        </text>
      </g>

    </g>

    <!-- ================= RIGHT COLUMN: 5 MARKETPLACE BRAND CARDS ================= -->
    <g transform="translate(970, 70)">

      <!-- Grid Row 1 (Top 3 Cards) -->
      
      <!-- 1. TRENDYOL CARD -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect width="260" height="150" rx="20" fill="url(#cardGrad)" stroke="#f27a1a" stroke-width="1.8" stroke-opacity="0.6" />
        <rect x="0" y="0" width="260" height="150" rx="20" fill="#f27a1a" fill-opacity="0.05" />
        
        <!-- Header Pill -->
        <rect x="18" y="18" width="105" height="26" rx="8" fill="#f27a1a" />
        <text x="70.5" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">trendyol</text>

        <!-- Official Badge -->
        <rect x="135" y="20" width="108" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" />
        <text x="189" y="35" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fed7aa" text-anchor="middle">YETKİLİ MAĞAZA</text>

        <!-- Store Name -->
        <text x="18" y="78" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">umutMed</text>
        <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Trendyol Medikal Mağazası</text>

        <!-- Rating Stars & Tag -->
        <g transform="translate(18, 114)">
          <text font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">★ ★ ★ ★ ★ <tspan fill="#ffffff" font-weight="700"> 4.9 Satıcı Puanı</tspan></text>
        </g>
      </g>

      <!-- 2. HEPSİBURADA CARD -->
      <g transform="translate(285, 0)" filter="url(#cardShadow)">
        <rect width="260" height="150" rx="20" fill="url(#cardGrad)" stroke="#ff6000" stroke-width="1.8" stroke-opacity="0.6" />
        <rect x="0" y="0" width="260" height="150" rx="20" fill="#ff6000" fill-opacity="0.05" />
        
        <!-- Header Pill -->
        <rect x="18" y="18" width="125" height="26" rx="8" fill="#ff6000" />
        <text x="80.5" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.3">hepsiburada</text>

        <!-- Official Badge -->
        <rect x="155" y="20" width="88" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" />
        <text x="199" y="35" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fed7aa" text-anchor="middle">ONAYLI SATICI</text>

        <!-- Store Name -->
        <text x="18" y="78" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">umut-med</text>
        <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Hepsiburada Resmi Satıcı</text>

        <!-- Fast delivery tag -->
        <g transform="translate(18, 114)">
          <text font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#38bdf8">⚡ Hepsiburada Güvencesiyle</text>
        </g>
      </g>

      <!-- 3. AMAZON CARD -->
      <g transform="translate(570, 0)" filter="url(#cardShadow)">
        <rect width="260" height="150" rx="20" fill="url(#cardGrad)" stroke="#ff9900" stroke-width="1.8" stroke-opacity="0.5" />
        <rect x="0" y="0" width="260" height="150" rx="20" fill="#ffffff" fill-opacity="0.04" />
        
        <!-- Header Pill -->
        <rect x="18" y="18" width="115" height="26" rx="8" fill="#131921" stroke="#ff9900" stroke-width="1" />
        <text x="60" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">amazon<tspan fill="#ff9900">.tr</tspan></text>
        <!-- Amazon Smile Arc -->
        <path d="M85 36 Q100 42 112 36" stroke="#ff9900" stroke-width="1.5" fill="none" stroke-linecap="round" />

        <!-- Official Badge -->
        <rect x="145" y="20" width="98" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" />
        <text x="194" y="35" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fed7aa" text-anchor="middle">KURUMSAL</text>

        <!-- Store Name -->
        <text x="18" y="78" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">umutMed</text>
        <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Amazon Türkiye Mağazası</text>

        <!-- Tag -->
        <g transform="translate(18, 114)">
          <text font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">✓ Orijinal &amp; Hızlı Teslimat</text>
        </g>
      </g>

      <!-- Grid Row 2 (Bottom 2 Cards - Centered & Wide) -->

      <!-- 4. N11 CARD -->
      <g transform="translate(80, 180)" filter="url(#cardShadow)">
        <rect width="320" height="145" rx="20" fill="url(#cardGrad)" stroke="#e11e24" stroke-width="1.8" stroke-opacity="0.6" />
        <rect x="0" y="0" width="320" height="145" rx="20" fill="#e11e24" fill-opacity="0.05" />
        
        <!-- Header Pill -->
        <rect x="18" y="18" width="85" height="26" rx="8" fill="#e11e24" />
        <text x="52" y="35" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">n11</text>
        <circle cx="82" cy="27" r="3" fill="#ffffff" />

        <!-- Official Badge -->
        <rect x="190" y="20" width="112" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" />
        <text x="246" y="35" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">RESMİ MAĞAZA</text>

        <!-- Store Name -->
        <text x="18" y="78" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">umutmedikal</text>
        <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">n11 Yetkili Medikal Satıcısı</text>

        <!-- Tag -->
        <g transform="translate(18, 118)">
          <text font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#34d399">★ %100 Başarılı Satıcı Güvencesi</text>
        </g>
      </g>

      <!-- 5. PTTAVM CARD -->
      <g transform="translate(430, 180)" filter="url(#cardShadow)">
        <rect width="320" height="145" rx="20" fill="url(#cardGrad)" stroke="#ffc72c" stroke-width="1.8" stroke-opacity="0.6" />
        <rect x="0" y="0" width="320" height="145" rx="20" fill="#ffc72c" fill-opacity="0.05" />
        
        <!-- Header Pill -->
        <rect x="18" y="18" width="110" height="26" rx="8" fill="#00a9ce" />
        <text x="73" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">Ptt<tspan fill="#ffc72c">AVM</tspan></text>

        <!-- Official Badge -->
        <rect x="185" y="20" width="118" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" />
        <text x="244" y="35" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle">DOĞRULANMIŞ SATICI</text>

        <!-- Store Name -->
        <text x="18" y="78" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">umutmed</text>
        <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">PttAVM Resmi Medikal Mağazası</text>

        <!-- Tag -->
        <g transform="translate(18, 118)">
          <text font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#38bdf8">🛡️ PTT Kargo &amp; Devlet Güvencesi</text>
        </g>
      </g>

      <!-- Bottom Trust Text / Call to Action -->
      <g transform="translate(80, 360)">
        <rect width="670" height="42" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="335" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">
          Dilediğiniz platformdan güvenle alışveriş yapabilir veya sitemiz üzerinden doğrudan sipariş verebilirsiniz.
        </text>
      </g>

    </g>

  </g>
</svg>
